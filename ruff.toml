required-version = "==0.17.5"

[lint]
select = ["E4", "E7", "E9", "F", "B", "C901", "PLR0915"]

[lint.per-file-ignores]
# Script tests set sys.path before importing standalone modules.
# Revisit if scripts becomes a Python package.
"scripts/tests/test_local_safety.py" = ["E402"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-statements = 50
