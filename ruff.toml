required-version = "==0.17.5"

[lint]
select = ["E4", "E7", "E9", "F", "B", "C901", "PLR0915"]

[lint.per-file-ignores]
# Тесты скриптов без Python package: sys.path задаётся до импорта модулей.
# Пересмотр при переходе scripts на штатный package layout.
"scripts/tests/test_local_safety.py" = ["E402"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-statements = 50
