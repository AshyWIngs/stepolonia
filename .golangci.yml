version: '2'
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable: [staticcheck, errcheck, gosec, gocognit, gocyclo, unused, funlen, goconst, revive]
  settings:
    revive:
      enable-default-rules: false
      rules:
        - name: argument-limit
          arguments: [7]
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    goconst:
      min-len: 3
      min-occurrences: 3
      # Transport call arguments include MIME types, query keys, headers, and error codes.
      ignore-calls: false
      ignore-tests: false
  exclusions:
    presets: []
    rules:
      # G704 misses the loopback URL boundary. The URL is rebuilt from a validated
      # port and the client rejects redirects. Revisit if the guard, callers, or transport change.
      - path: ^apps/api/internal/database/publishing_http_test\.go$
        linters: [gosec]
        text: G704
        source: '^\s*(request, err := http\.NewRequestWithContext\(ctx, http\.MethodGet, target, nil\)|response, err := client\.Do\(request\))$'
      # These cleanup paths separately check the read, commit, or rows.Err result.
      # Revisit if the file or transaction boundary changes.
      - path: ^apps/api/cmd/db/main\.go$
        linters: [errcheck]
        source: '^\s*defer (f|db)\.Close\(\)'
      - path: ^apps/api/internal/database/(database|languages|schema_contract)\.go$
        linters: [errcheck]
        source: '^\s*defer tx\.Rollback\(\)'
      - path: ^apps/api/internal/database/integration_test\.go$
        linters: [errcheck]
        source: '^\s*defer (db\.Close\(\)|second\.Close\(ctx\))'
      - path: ^apps/api/internal/database/schema_contract\.go$
        linters: [errcheck]
        source: '^\s*defer rows\.Close\(\)'
      # Revisit security exemptions if the source, sink, caller, or trust
      # boundary changes. Reassess whenever an input becomes externally controlled.
      # False positive: the operator selects a file on a read-only import mount.
      # Revisit if another source can supply the path.
      - path: ^apps/api/cmd/db/main\.go$
        linters: [gosec]
        text: '^G(304|703):'
        source: 'f, err := os\.Open\(path\)'
      # FP: shared operator configuration selects a local credential, never HTTP input.
      # O_NOFOLLOW + fstat enforce private regular file/UID; reads are size-capped.
      - path: ^apps/api/internal/config/auth\.go$
        linters: [gosec]
        text: '^G(304|703):'
        source: 'f, err := os\.OpenFile\(path, os\.O_RDONLY\|syscall\.O_NOFOLLOW\|syscall\.O_NONBLOCK, 0\)'
      # FP: own temporary password file is deliberately made readable to assert rejection.
      - path: ^apps/api/internal/config/auth_test\.go$
        linters: [gosec]
        text: '^G302:'
        source: 'if err := os\.Chmod\(password, 0644\); err != nil'
      # FP: exact ACL negative tests target a UUID-derived, Identifier.Sanitize-quoted
      # disposable login. No request data reaches these owner-only statements.
      - path: ^apps/api/internal/database/auth_schema_integration_test\.go$
        linters: [gosec]
        text: '^G202:'
        source: '^\s*_, err = db\.Exec\("(GRANT DELETE ON public\.users TO |REVOKE DELETE ON public\.users FROM |GRANT sp_publisher TO |REVOKE sp_publisher FROM )" \+ quoted\)$'
      # FP: disposable PostgreSQL fixture credential, never a shipped account.
      - path: ^apps/api/internal/adminintegration/bootstrap_integration_test\.go$
        linters: [gosec]
        text: '^G101:'
        source: '^const bootstrapTestPassphrase = '
      # FP: fixed security-table inventory in a disposable ACL negative test;
      # pgx.Identifier quotes both schema and table before execution.
      - path: ^apps/api/internal/adminintegration/bootstrap_integration_test\.go$
        linters: [gosec]
        text: '^G202:'
        source: '_, err = tx\.ExecContext\(ctx, "SELECT \* FROM "\+pgx\.Identifier\{"public", table\}\.Sanitize\(\)\)'
      # False positive: Compose supplies the secret path, and a non-root process reads it.
      - path: ^apps/api/internal/config/config\.go$
        linters: [gosec]
        text: '^G(304|703):'
        source: 'password, err := os\.ReadFile\(path\)'
      # False positive: the disposable test harness owns the path.
      - path: ^apps/api/internal/database/integration_test\.go$
        linters: [gosec]
        text: '^G(304|703):'
        source: 'raw, err := os\.ReadFile\(path\)'
      # False positive: pgx.Identifier.Sanitize quotes current_user before GRANT.
      - path: ^apps/api/internal/database/integration_test\.go$
        linters: [gosec]
        text: '^G202:'
        source: 'grant := "GRANT " \+ pgx\.Identifier\{owner\}\.Sanitize\(\)'
      # False positive: an absolute psql path, fixed SQL and arguments, and operator-owned environment.
      # Only trusted configuration may supply libpq conninfo through the database name.
      - path: ^infrastructure/postgres/healthcheck/main\.go$
        linters: [gosec]
        text: '^G(204|702):'
        source: 'cmd := exec\.CommandContext\(ctx, "/usr/libexec/postgresql18/psql",'
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
