name: ${COMPOSE_PROJECT_NAME:?Select an installation with its env file}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: sp-caddy:stage0
    build: { context: ./caddy }
    user: "10001:10001"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    networks: [app]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    logging: *logging
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: [CMD, /usr/local/bin/caddy-healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    image: sp-web:stage0
    build: { context: ../apps/web }
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:?}
      NUXT_PUBLIC_SITE_TAGLINE: ${NUXT_PUBLIC_SITE_TAGLINE:-}
      NUXT_PUBLIC_SITE_DESCRIPTION: ${NUXT_PUBLIC_SITE_DESCRIPTION:-}
      NUXT_PUBLIC_SITE_NOTICE: ${NUXT_PUBLIC_SITE_NOTICE:-}
      NUXT_PUBLIC_SITE_LOCALE: ${NUXT_PUBLIC_SITE_LOCALE:-ru}
      NUXT_PUBLIC_SITE_ACCENT: ${NUXT_PUBLIC_SITE_ACCENT:-#a52837}
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 100
    logging: *logging
    healthcheck:
      test: [CMD, /usr/bin/node, --input-type=module, -e, "const r = await fetch('http://127.0.0.1:3000/health/live', {signal: AbortSignal.timeout(2000)}); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  api:
    image: sp-api:stage0
    build: { context: ../apps/api }
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      DB_NAME: ${POSTGRES_DB:?}
      DB_USER: ${DB_USER:?}
      GOMEMLIMIT: 192MiB
    secrets: [db_app_password]
    networks: [app, data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, /app/api, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db-tools:
    profiles: [tools]
    image: sp-db-tools:stage1.2
    build: { context: ../apps/api, target: dbtools }
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:?}
      DB_USER: ${POSTGRES_USER:?}
      RUNTIME_DB_USER: ${DB_USER:?}
      DB_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 192m
    pids_limit: 64
    logging: *logging

  postgres-init:
    image: sp-postgres-init:stage0
    build: { context: ./postgres, target: bootstrap }
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      DB_USER: ${DB_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    secrets: [db_owner_password, db_app_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0770
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 30s
    mem_limit: 1536m
    cpus: 0.5
    pids_limit: 150
    logging: *logging

  postgres:
    image: sp-postgres:stage0
    build: { context: ./postgres }
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      DB_USER: ${DB_USER:?}
    secrets: [db_app_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0770
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1536m
    cpus: 0.5
    pids_limit: 150
    logging: *logging
    depends_on:
      postgres-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /usr/local/bin/pg-healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  app: {}
  data: { internal: true }

volumes:
  postgres_data:
    name: ${DB_VOLUME_NAME:?}
    external: ${DB_VOLUME_EXTERNAL:-false}

secrets:
  db_owner_password: { file: "../sites/${SITE_ID:?}/.secrets/db_owner_password" }
  db_app_password: { file: "../sites/${SITE_ID:?}/.secrets/db_app_password" }
