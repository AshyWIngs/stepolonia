name: PR Merge Notice

on:
  # Исполняется доверенная версия workflow из base branch, а не код PR.
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Не использовать checkout, артефакты, команды или скрипты из PR.
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request
            const marker = '<!-- stepolonia-ci-watch:merged:' + pr.merge_commit_sha + ' -->'
            const message = marker + '\nSquash merge выполнен: ' + pr.merge_commit_sha +
              '. Все обязательные GitHub Gate остаются в истории PR.'
            await core.summary.addRaw('PR #' + pr.number +
              ' слит в main: `' + pr.merge_commit_sha + '`\n').write()
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message,
              })
            } catch (error) {
              if (error.status !== 403 ||
                  !String(error.message).includes('Resource not accessible by integration')) {
                throw error
              }
              // Не повышаем права и не запрашиваем отдельные токены.
              core.warning('GitHub не разрешил комментарий к слитому PR #' + pr.number +
                '; результат merge остаётся в Actions Job Summary.')
            }
