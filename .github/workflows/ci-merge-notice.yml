name: PR Merge Notice

on:
  # Use the trusted workflow from the base branch.
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Keep pull request checkouts, artifacts, and scripts outside this workflow.
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request
            const marker = '<!-- stepolonia-ci-watch:merged:' + pr.merge_commit_sha + ' -->'
            const message = marker + '\nSquash merge completed: ' + pr.merge_commit_sha +
              '. Required checks are available in the pull request history.'
            await core.summary.addRaw('PR #' + pr.number +
              ' merged into main: `' + pr.merge_commit_sha + '`\n').write()
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message,
              })
            } catch (error) {
              if (error.status !== 403 ||
                  !String(error.message).includes('Resource not accessible by integration')) {
                throw error
              }
              // Keep the existing token permissions.
              core.warning('GitHub refused to comment on merged PR #' + pr.number +
                '. The merge is recorded in the Actions job summary.')
            }
