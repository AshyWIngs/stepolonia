name: PR Merge Notice

on:
  pull_request:
    types: [closed]

# На pull_request GITHUB_TOKEN может не иметь права создавать комментарии.
# Сам факт merge уже сохраняется GitHub; здесь фиксируем его без API-записи.
permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Зафиксировать merge в журнале Actions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          printf 'PR #%s принят в main: %s\n' "$PR_NUMBER" "$MERGE_SHA"
          {
            printf '## PR #%s слит в main\n\n' "$PR_NUMBER"
            printf 'Squash merge: `%s`\n' "$MERGE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
