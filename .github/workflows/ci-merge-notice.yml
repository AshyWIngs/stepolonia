name: PR Merge Notice

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // Не исполняем и не загружаем код PR; сообщаем только факт GitHub merge.
            const pr = context.payload.pull_request
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '<!-- stepolonia-ci-watch:merged:' + pr.merge_commit_sha + ' -->\n' +
                'Squash merge выполнен: ' + pr.merge_commit_sha +
                '. Все обязательные GitHub Gate остаются в истории PR.',
            })
