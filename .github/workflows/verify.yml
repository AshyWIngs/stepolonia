name: Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Полный PR Gate обязателен для защищённой main; после merge повторный Verify не запускаем.
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Имя job сохраняем: существующий required status check не переименовываем.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select checks for current PR
        id: scope
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_DRAFT" == "true" ]]; then
              echo "full=false" >> "$GITHUB_OUTPUT"
              echo "Draft PR: полный verify запускается при ready_for_review."
              exit 0
            fi
            # Checkout PR merge commit: HEAD^1 — целевая main.
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if [[ -n "$changed" ]] && ! grep -qvE '\.md$' <<< "$changed"; then
              echo "full=false" >> "$GITHUB_OUTPUT"
              echo "Только Markdown: автоматические проверки исходников не требуются."
              exit 0
            fi
          fi
          # Готовые PR с изменениями кода и ручной запуск: полный Gate.
          echo "full=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.full == 'true'
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - name: Pinned SDK package manager
        if: steps.scope.outputs.full == 'true'
        run: npm install --global npm@11.21.2 --ignore-scripts
      - name: CI watcher logic tests
        if: steps.scope.outputs.full == 'true'
        run: node --test .github/scripts/ci-watch.test.cjs
      - name: Lint, duplicates, checks, builds, PostgreSQL and image CVEs
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test verify
      - name: PostgreSQL failure details
        if: ${{ failure() && steps.scope.outputs.full == 'true' }}
        run: |
          for log in reports/publishing-*.log; do
            if [ -f "$log" ]; then
              tail -n 120 "$log"
            fi
          done
      - name: Краткая диагностика новых замечаний внешних анализаторов
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.checks.listForRef({
              owner, repo, ref: process.env.HEAD_SHA, per_page: 100,
            })
            for (const c of data.check_runs || []) {
              if (!['SonarCloud Code Analysis', 'Codacy Static Code Analysis'].includes(c.name)
                  || c.status !== 'completed'
                  || (c.conclusion === 'success' && !c.output?.annotations_count)) continue
              core.info(c.name + ': ' + c.conclusion + ', annotations: ' + (c.output?.annotations_count || 0))
              const rows = await github.rest.checks.listAnnotations({
                owner, repo, check_run_id: c.id, per_page: 50,
              })
              for (const a of rows.data.slice(0, 50)) {
                core.info([a.path, a.start_line, a.annotation_level,
                  (a.message || '').slice(0, 450)].join(':'))
              }
            }
      - name: Quality and image CVE reports
        if: ${{ always() && steps.scope.outputs.full == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            reports/*lint.log
            reports/duplicates.log
            reports/images/*.json
            reports/images/*.identity
            reports/images/*.log
