name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Lint, duplicates, checks, builds, PostgreSQL and image CVEs
        run: make SITE=ci.test verify
      - name: PostgreSQL failure details
        if: failure()
        run: |
          for log in reports/publishing-*.log; do
            if [ -f "$log" ]; then
              tail -n 120 "$log"
            fi
          done
      - name: Quality and image CVE reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            reports/*lint.log
            reports/duplicates.log
            reports/images/*.json
            reports/images/*.identity
            reports/images/*.log
