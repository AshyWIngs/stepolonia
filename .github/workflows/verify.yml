name: Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Run Verify on pull requests and on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep the status check ID stable and share the Make prerequisite graph.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Owner-approved for the Stage 3 integration candidate only.
      STAGE3_SKIP_IMAGE_AUDIT: ${{ github.event_name == 'pull_request' && github.repository == 'AshyWIngs/stepolonia' && github.base_ref == 'main' && github.event.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/account-security-administration' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Determine pull request verification scope"
        id: scope
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_DRAFT" == "true" ]]; then
              echo "full=false" >> "$GITHUB_OUTPUT"
              echo "Draft PR: full Verify runs when it is ready for review."
              exit 0
            fi
            # The first parent of the checked-out merge commit is the base branch.
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if [[ -n "$changed" ]] && ! grep -qvE '\.md$' <<< "$changed"; then
              echo "full=false" >> "$GITHUB_OUTPUT"
              echo "Markdown-only changes do not require source checks."
              exit 0
            fi
          fi
          echo "full=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.full == 'true'
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            apps/web/package-lock.json
            apps/api/internal/platform/docsassets/package-lock.json
      - name: "Install the pinned npm version"
        id: npm_tool
        if: steps.scope.outputs.full == 'true'
        run: npm install --global npm@11.21.2 --ignore-scripts
      - uses: actions/setup-python@v7.1.0
        if: steps.scope.outputs.full == 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: infrastructure/quality/sql-requirements.txt
      - name: "Install SQLFluff 4.5.0"
        if: steps.scope.outputs.full == 'true'
        run: |
          make python-version-check
          python3 -m venv "$RUNNER_TEMP/sqlfluff"
          PATH="$RUNNER_TEMP/sqlfluff/bin:$PATH" make python-version-check
          "$RUNNER_TEMP/sqlfluff/bin/python3" -m pip install -r infrastructure/quality/sql-requirements.txt
          echo "$RUNNER_TEMP/sqlfluff/bin" >> "$GITHUB_PATH"
      - name: "Docker: cache build dependencies"
        if: steps.scope.outputs.full == 'true'
        uses: ./.github/actions/build-dependencies
      - name: "Chromium: cache the pinned browser"
        if: steps.scope.outputs.full == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-headless-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/web/package-lock.json') }}
      # Use the same runner and Docker daemon throughout.
      # Match make verify without repeating PHONY prerequisites.
      - name: "Go: static analysis"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test lint-go
      - name: "Python: static analysis"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test lint-python
      - name: "Nuxt: static analysis"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test lint-web
      - name: "SQL: lint migrations with SQLFluff"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test lint-sql
      - name: "Duplication: scan source code"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test duplicates
      - name: "API: verify the contract and TypeScript SDK"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test sdk-check
      - name: "Installation: prepare ci.test"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test setup
      - name: "Compose: validate configuration"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test ci-config
      - name: "Dockerfile: validate build instructions"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test docker-check
      - name: "Python: run tests"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test python-tests
      - name: "API: run Go tests"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test api-checks
      - name: "Nuxt: test and build"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test web-checks
      - name: "Infrastructure: test Caddy and PostgreSQL"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test ci-service-checks
      - name: "Docker: build installation services"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test ci-build
      - name: "PostgreSQL: migrations, roles, and CLI"
        if: steps.scope.outputs.full == 'true'
        env:
          VERIFY_REUSE_IMAGES: "1"
        run: make SITE=ci.test ci-db-test
      - name: "Publishing: API, SSR, and browser"
        if: steps.scope.outputs.full == 'true'
        env:
          VERIFY_REUSE_IMAGES: "1"
        run: make SITE=ci.test ci-publishing-test
      - name: "Authentication: PostgreSQL, TLS, and browser security"
        if: steps.scope.outputs.full == 'true'
        run: make SITE=ci.test auth-test
      - name: "Security: record the Stage 3 image audit exception"
        if: steps.scope.outputs.full == 'true' && env.STAGE3_SKIP_IMAGE_AUDIT == 'true'
        run: echo "::warning::Image CVE audit skipped for the Stage 3 integration candidate (PR #63)."
      - name: "Security: audit 11 images for CVEs"
        if: steps.scope.outputs.full == 'true' && env.STAGE3_SKIP_IMAGE_AUDIT != 'true'
        env:
          VERIFY_ACCEPT_RECORDED_FINDINGS: ${{ github.event_name == 'pull_request' && github.repository == 'AshyWIngs/stepolonia' && github.base_ref == 'main' && (github.event.number == 43 || github.event.number == 44) }}
        run: make SITE=ci.test ci-image-audit
      - name: "Diagnostics: PostgreSQL and browser logs on failure"
        if: ${{ failure() && steps.scope.outputs.full == 'true' }}
        shell: bash
        run: |
          shopt -s nullglob
          logs=(reports/publishing-*.log)
          if (( ${#logs[@]} == 0 )); then
            echo "Publishing logs are unavailable. Check earlier or unrelated failed steps."
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "::group::Diagnostics: $(basename "$log") (last 120 lines)"
            tail -n 120 "$log"
            echo "::endgroup::"
          done
      - name: "Nuxt dependencies: npm advisories"
        if: ${{ always() && steps.scope.outputs.full == 'true' && steps.npm_tool.outcome == 'success' }}
        shell: bash
        run: |
          # Report advisories from the lockfile.
          mkdir -p reports
          status=0
          (cd apps/web && npm audit --json --package-lock-only) > reports/npm-audit.json 2> reports/npm-audit.stderr || status=$?
          printf '%s\n' "$status" > reports/npm-audit.exit
          echo "npm audit exit=$status (exit 1 can indicate advisories. See the job summary for the result)."
      - name: "Report: npm advisories and warnings"
        if: ${{ always() && steps.scope.outputs.full == 'true' }}
        run: python3 scripts/ci_verify_report.py summary
      - name: "Artifacts: checks and CVE reports"
        if: ${{ always() && steps.scope.outputs.full == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            reports/*lint.log
            reports/*checks.log
            reports/*docker-check.log
            reports/duplicates.log
            reports/publishing-*.log
            reports/images/*.json
            reports/images/*.identity
            reports/images/*.log
            reports/npm-audit.json
            reports/npm-audit.exit
            reports/npm-audit.stderr
